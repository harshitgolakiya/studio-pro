name: Build macOS App

# Manual runs any time, plus automatic runs when a version tag is pushed
# (e.g. `git tag v2.0.0 && git push --tags`) so tagged releases always have
# a matching macOS build attached.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (arm64): M-series and A18 Pro MacBook Neo
            arch_label: apple-silicon
          - runner: macos-15-intel  # Intel (x86_64); macos-13 was retired and never gets a runner
            arch_label: intel
    runs-on: ${{ matrix.runner }}
    # A healthy build takes 2-5 minutes. Without this, a hung step (e.g. a test
    # blocked on a modal dialog) runs to GitHub's 6-hour default.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-studio.txt

      - name: Install FFmpeg via Homebrew
        run: |
          brew install ffmpeg ghostscript
          bash setup_studio_macos.sh

      - name: Stage bundled FFmpeg binaries
        run: |
          mkdir -p vendor/ffmpeg-mac
          cp "$(command -v ffmpeg)" vendor/ffmpeg-mac/ffmpeg
          cp "$(command -v ffprobe)" vendor/ffmpeg-mac/ffprobe
          chmod +x vendor/ffmpeg-mac/ffmpeg vendor/ffmpeg-mac/ffprobe
          mkdir -p vendor/ghostscript/bin vendor/libreoffice
          cp "$(command -v gs)" vendor/ghostscript/bin/gs

      - name: Stage speech and translation assets
        run: |
          python setup_studio_models.py
          python -c "from model_catalog import find_entry,install; install(find_entry('whisper-base')); install(find_entry('translate-es-en'))"

      - name: Source runtime regression
        run: python -c "from pathlib import Path; from studio_smoke import run; raise SystemExit(run(Path('studio-verification/source-smoke.json')))"

      - name: Run automated tests
        timeout-minutes: 25
        env:
          SHADOW_TEST_FULL_STUDIO: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Shadow.app with PyInstaller
        run: |
          python -m PyInstaller --clean Shadow-mac.spec
          mkdir -p dist/Shadow.app/Contents/Frameworks/vendor/libreoffice
          cp -R vendor/libreoffice/LibreOffice.app dist/Shadow.app/Contents/Frameworks/vendor/libreoffice/LibreOffice.app
          codesign --force --deep -s - dist/Shadow.app

      - name: Packaged runtime regression
        run: |
          SHADOW_LIBREOFFICE="$PWD/dist/Shadow.app/Contents/Frameworks/vendor/libreoffice/LibreOffice.app/Contents/MacOS/soffice" \
          dist/Shadow.app/Contents/MacOS/Shadow --studio-smoke-report "$PWD/studio-verification/packaged-smoke.json"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agency-Studio-verification-${{ matrix.arch_label }}
          path: studio-verification/*.json

      - name: Import Apple Developer Certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-build-keychain' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Codesign Shadow.app
        run: |
          chmod +x sign_macos.sh
          ./sign_macos.sh "dist/Shadow.app" "" "entitlements.plist"

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p installer dmg_staging
          cp -R "dist/Shadow.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Shadow Media Studio Pro" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "installer/Shadow-Media-Studio-Setup-${{ matrix.arch_label }}.dmg"

      - name: Sign, Notarize, and Staple DMG
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./sign_macos.sh "dist/Shadow.app" "installer/Shadow-Media-Studio-Setup-${{ matrix.arch_label }}.dmg" "entitlements.plist"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-macOS-${{ matrix.arch_label }}
          path: installer/Shadow-Media-Studio-Setup-${{ matrix.arch_label }}.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Shadow-Media-Studio-Setup-${{ matrix.arch_label }}.dmg
